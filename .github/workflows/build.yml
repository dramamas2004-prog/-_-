name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # لو الملفات اترفعت متفرقة في الصفحة الرئيسية، نرتّبها هنا تلقائيًا
      - name: Organize files
        run: |
          mkdir -p www/assets scripts
          for f in app.js index.html style.css; do
            if [ -f "$f" ]; then cp -f "$f" "www/$f"; fi
          done
          for f in prepare.js make_icons.py; do
            if [ -f "$f" ]; then cp -f "$f" "scripts/$f"; fi
          done
          ls -R www scripts | head -40

      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - run: npm install
      - name: Optional - keep screen awake plugin
        continue-on-error: true
        run: npm install @capacitor-community/keep-awake@^6.0.0
      - run: npm run prepare:data

      - name: Download fonts
        run: |
          mkdir -p www/fonts
          curl -L -f -o www/fonts/AmiriQuran.ttf "https://github.com/google/fonts/raw/main/ofl/amiriquran/AmiriQuran-Regular.ttf"
          curl -L -f -o www/fonts/Cairo.ttf "https://github.com/google/fonts/raw/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf" || true

      - run: npx cap add android
      - name: Android permissions and icons
        continue-on-error: true
        run: |
          pip install pillow
          python3 scripts/make_icons.py
      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: noor-quran-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
